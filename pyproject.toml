# WiFi Audit Lab · metadatos del proyecto y configuración de herramientas.
#
# NOTA sobre empaquetado: NO es necesario instalar este proyecto como paquete
# pip para usarlo (ver README, sección "Empaquetado opcional"). El flujo
# recomendado en el laboratorio es clonar el repositorio, crear un venv y
# ejecutar `sudo -E python3 main.py`, porque la aplicación requiere root,
# las herramientas del sistema (aircrack-ng) y hardware inalámbrico real.
# Este archivo existe para:
#   1. Centralizar los metadatos del proyecto.
#   2. Guardar la configuración de ruff que usa el workflow de CI.
#   3. Permitir, si algún día interesa, `pip install .` y el comando
#      `wifi-audit-lab`.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-audit-lab"
version = "1.0.0"
description = "Laboratorio GUI (PyQt6) para el estudio guiado del flujo de auditoria WPA/WPA2 con la suite aircrack-ng. Proyecto academico de uso exclusivamente educativo."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "Nombre del autor" },  # TODO: sustituir por el nombre real
]
keywords = [
    "wifi",
    "aircrack-ng",
    "auditoria",
    "seguridad",
    "educacion",
    "pyqt6",
    "laboratorio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Security",
]
dependencies = [
    "PyQt6>=6.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.gui-scripts]
wifi-audit-lab = "main:main"

[project.urls]
Homepage = "https://github.com/TU_USUARIO/wifi-audit-gui"
Issues = "https://github.com/TU_USUARIO/wifi-audit-gui/issues"

[tool.setuptools]
# Estructura plana del proyecto: main.py como módulo y los dos paquetes.
py-modules = ["main"]
packages = ["core", "ui", "ui.pages"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Reglas activas: pycodestyle (E/W), pyflakes (F) e isort (I).
# Se relajan conscientemente E501 en líneas de mensajes de usuario muy largas
# si hiciera falta, pero el código actual pasa con 88 columnas.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui"]
